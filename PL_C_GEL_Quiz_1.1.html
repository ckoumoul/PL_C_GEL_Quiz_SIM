<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Διαδραστικό Quiz Εμπέδωσης - 1η Εβδομάδα (Πληροφορική Γ΄ Λυκείου)</title>
  <style>
    :root {
      --bg-main: #FBF9F5;
      --card-bg: #FFFFFF;
      --accent-sage: #5A7361;
      --accent-sage-hover: #485C4E;
      --accent-terracotta: #C86A4B;
      --accent-terracotta-hover: #B0573A;
      --text-dark: #2C2A29;
      --text-muted: #6E6A66;
      --border-color: #E5E0D8;
      --sand-light: #F2EFE9;
      --success-bg: #E8F5E9;
      --success-border: #3B7A57;
      --danger-bg: #FDF2F0;
      --danger-border: #B84A39;
      --shadow-sm: 0 4px 12px rgba(44, 42, 41, 0.05);
      --shadow-md: 0 8px 24px rgba(44, 42, 41, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-md);
    }

    /* PROGRESS BAR */
    .progress-wrapper {
      margin-bottom: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: var(--sand-light);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-sage);
      transition: width 0.3s ease;
    }

    /* QUESTION CARD */
    .question-card {
      display: block;
    }

    .question-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--sand-light);
      border-color: var(--accent-sage);
    }

    .option-btn.selected-correct {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-border);
      font-weight: 700;
    }

    .option-btn.selected-incorrect {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-border);
      font-weight: 700;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* HINT & EXPLANATION BOXES */
    .hint-box {
      display: none;
      background-color: #FFF9F2;
      border-left: 4px solid #D97724;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #7A410D;
      margin-bottom: 15px;
    }

    .explanation-box {
      display: none;
      background-color: var(--sand-light);
      border-left: 4px solid var(--accent-sage);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-dark);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* ACTION BUTTONS */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sage {
      background-color: var(--accent-sage);
      color: #FFF;
    }

    .btn-sage:hover:not(:disabled) {
      background-color: var(--accent-sage-hover);
    }

    .btn-terracotta {
      background-color: var(--accent-terracotta);
      color: #FFF;
    }

    .btn-terracotta:hover:not(:disabled) {
      background-color: var(--accent-terracotta-hover);
    }

    .btn-secondary {
      background-color: var(--sand-light);
      color: var(--text-dark);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* FINAL REPORT SCREEN */
    .report-screen {
      display: none;
    }

    .score-summary {
      text-align: center;
      padding: 25px;
      background-color: var(--bg-main);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-sage);
      margin-bottom: 5px;
    }

    .score-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      background-color: var(--sand-light);
    }

    .report-title {
      font-size: 1.2rem;
      color: var(--accent-sage);
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--sand-light);
    }

    .report-item {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
      background-color: #FFF;
    }

    .report-item.correct {
      border-left: 5px solid var(--success-border);
    }

    .report-item.incorrect {
      border-left: 5px solid var(--danger-border);
    }

    .report-q-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .report-ans {
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .report-ans.user-choice {
      color: var(--text-dark);
    }

    .report-ans.correct-choice {
      color: var(--success-border);
      font-weight: 600;
    }

    .report-exp {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    /* PRINT STYLES */
    @media print {
      body {
        background-color: #FFF;
        padding: 0;
      }
      .container {
        border: none;
        box-shadow: none;
        padding: 0;
      }
      .controls-row, header p, .nav-tabs, .btn {
        display: none !important;
      }
      .report-screen {
        display: block !important;
      }
      .question-card {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Διαδραστικό Quiz Εμπέδωσης</h1>
    <p>1η Εβδομάδα: Εισαγωγή στην Πληροφορική, Αλγόριθμοι & Γλώσσες Προγραμματισμού</p>
  </header>

  <div class="container">
    
    <!-- QUIZ VIEW -->
    <div id="quiz-view">
      <div class="progress-wrapper">
        <div class="progress-info">
          <span id="question-counter">Ερώτηση 1 από 10</span>
          <span id="progress-percent">10%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="question-card">
        <div id="question-text" class="question-title">Κείμενο Ερώτησης</div>
        
        <div id="options-container" class="options-list">
          <!-- Options rendered dynamically -->
        </div>

        <div id="hint-box" class="hint-box">
          💡 <strong>Υπόδειξη:</strong> <span id="hint-text"></span>
        </div>

        <div id="explanation-box" class="explanation-box">
          📌 <strong>Αιτιολόγηση:</strong> <span id="explanation-text"></span>
        </div>

        <div class="controls-row">
          <button id="hint-btn" class="btn btn-secondary" onclick="toggleHint()">💡 Υπόδειξη</button>
          <div>
            <button id="next-btn" class="btn btn-sage" onclick="nextQuestion()" disabled>Επόμενη ➔</button>
          </div>
        </div>
      </div>
    </div>

    <!-- REPORT VIEW -->
    <div id="report-view" class="report-screen">
      <div class="score-summary">
        <div id="final-score" class="score-number">0 / 10</div>
        <div id="score-badge" class="score-badge">Αποτελέσματα</div>
        <p id="score-message" style="color: var(--text-muted); font-size: 0.95rem;"></p>
      </div>

      <div class="report-title">📋 Αναλυτική Αναφορά Απαντήσεων & Αιτιολογήσεων</div>
      <div id="report-list">
        <!-- Summary items rendered dynamically -->
      </div>

      <div class="controls-row" style="margin-top: 25px;">
        <button class="btn btn-terracotta" onclick="resetQuiz()">🔄 Έναρξη από την Αρχή</button>
        <button class="btn btn-sage" onclick="window.print()">🖨️ Εκτύπωση Αποτελεσμάτων</button>
      </div>
    </div>

  </div>

  <script>
    const questionsData = [
      {
        id: 1,
        question: "Πόσα δεδομένα ΕΙΣΟΔΟΥ μπορεί να έχει υποχρεωτικά ένας αλγόριθμος;",
        options: [
          "Τουλάχιστον ένα δεδομένο",
          "Ακριβώς δύο δεδομένα",
          "Μηδέν ή περισσότερα δεδομένα",
          "Τουλάχιστον δύο δεδομένα"
        ],
        correct: 2,
        hint: "Σκεφτείτε αν ο υπολογισμός μιας μαθηματικής σταθεράς απαιτεί εξωτερικά δεδομένα από τον χρήστη.",
        explanation: "Ο αλγόριθμος μπορεί να μην έχει καμία είσοδο δεδομένων (0), αλλά πρέπει υποχρεωτικά να παράγει τουλάχιστον μία έξοδο (1)."
      },
      {
        id: 2,
        question: "Ποιο κριτήριο αλγορίθμου παραβιάζεται όταν μια εντολή είναι ασαφής ή επιδέχεται διαφορετικές ερμηνείες;",
        options: [
          "Περατότητα",
          "Αποτελεσματικότητα",
          "Καθοριστικότητα",
          "Είσοδος"
        ],
        correct: 2,
        hint: "Το κριτήριο αυτό απαιτεί κάθε εντολή να είναι απόλυτα σαφής και αυστηρά ορισμένη.",
        explanation: "Η Καθοριστικότητα απαιτεί κάθε εντολή να εκφράζεται χωρίς ασαφήνειες και να εκτελείται με τον ίδιο ακριβώς τρόπο."
      },
      {
        id: 3,
        question: "Ποιο από τα παρακάτω προβλήματα ανήκει στην κατηγορία των ΑΝΟΙΚΤΩΝ προβλημάτων;",
        options: [
          "Ο υπολογισμός του εμβαδού κύκλου",
          "Η πρόβλεψη των σεισμών",
          "Ο τετραγωνισμός του κύκλου με κανόνα και διαβήτη",
          "Η επίλυση πρωτοβάθμιας εξίσωσης"
        ],
        correct: 1,
        hint: "Ανοικτά είναι τα προβλήματα για τα οποία η λύση δεν έχει βρεθεί ακόμη, αλλά δεν έχει αποδειχθεί ότι είναι αδύνατη.",
        explanation: "Η πρόβλεψη σεισμών είναι ανοικτό πρόβλημα διότι δεν έχει βρεθεί ακόμη η λύση του, αλλά η επιστήμη δεν έχει αποδείξει ότι είναι ανεπίλυτο."
      },
      {
        id: 4,
        question: "Ποιο πρόγραμμα μεταφράζει ολόκληρο το πηγαίο πρόγραμμα στη γλώσσα μηχανής πριν ξεκινήσει η εκτέλεσή του;",
        options: [
          "Διερμηνευτής (Interpreter)",
          "Μεταγλωττιστής (Compiler)",
          "Συνδέτης (Linker)",
          "Διορθωτής (Debugger)"
        ],
        correct: 1,
        hint: "Το πρόγραμμα αυτό παράγει ένα αυτοτελές εκτελέσιμο αρχείο (εκτελέσιμο πρόγραμμα).",
        explanation: "Ο Μεταγλωττιστής (Compiler) μεταφράζει ολόκληρο το αρχικό πρόγραμμα σε εκτελέσιμο πρόγραμμα μηχανής. Ο Διερμηνευτής μεταφράζει και εκτελεί γραμμή-γραμμή."
      },
      {
        id: 5,
        question: "Τα συντακτικά λάθη ενός προγράμματος ανιχνεύονται:",
        options: [
          "Από τον χρήστη κατά την εκτέλεση",
          "Από τον Μεταγλωττιστή ή Διερμηνευτή κατά τη μετάφραση",
          "Μόνο με τη μέθοδο Μαύρου Κουτιού",
          "Από το λειτουργικό σύστημα"
        ],
        correct: 1,
        hint: "Τα συντακτικά λάθη αφορούν παραβιάσεις των κανόνων γραμματικής και συντακτικού της γλώσσας.",
        explanation: "Τα συντακτικά λάθη εντοπίζονται αυτόματα από το μεταφραστικό πρόγραμμα (μεταγλωττιστή ή διερμηνευτή) κατά τη διαδικασία της μετάφρασης."
      },
      {
        id: 6,
        question: "Τι συμβαίνει όταν ένα πρόγραμμα εκτελείται κανονικά αλλά παράγει λανθασμένα αποτελέσματα;",
        options: [
          "Υπάρχει συντακτικό λάθος",
          "Υπάρχει λογικό λάθος",
          "Υπάρχει λάθος εκτέλεσης (Run-time error)",
          "Υπάρχει σφάλμα μεταγλώττισης"
        ],
        correct: 1,
        hint: "Ο υπολογιστής εκτελεί πιστά τις εντολές, αλλά η σχεδίαση της λογικής του αλγορίθμου είναι εσφαλμένη.",
        explanation: "Τα λογικά λάθη οφείλονται σε εσφαλμένη σχεδίαση του αλγορίθμου. Το πρόγραμμα εκτελείται χωρίς διακοπή αλλά παράγει λανθασμένα αποτελέσματα."
      },
      {
        id: 7,
        question: "Η τεχνική σχεδίασης «Από πάνω προς τα κάτω» (Top-Down / Ιεραρχική Σχεδίαση) περιλαμβάνει:",
        options: [
          "Τη διάσπαση ενός σύνθετου προβλήματος σε απλούστερα υποπροβλήματα",
          "Την απευθείας γραφή κώδικα στη γλώσσα μηχανής",
          "Την κατάργηση των δομών επανάληψης",
          "Τη χρήση μόνο δυναμικών δομών δεδομένων"
        ],
        correct: 0,
        hint: "Βασίζεται στην αρχή «Διαίρει και Βασίλευε».",
        explanation: "Η Ιεραρχική Σχεδίαση αναλύει το αρχικό πρόβλημα σε ένα σύνολο απλούστερων υποπροβλημάτων, διευκολύνοντας την επίλυση και τη συντήρηση."
      },
      {
        id: 8,
        question: "Ποιο αποτελεί χαρακτηριστικό των ΦΥΣΙΚΩΝ γλωσσών σε σύγκριση με τις ΤΕΧΝΗΤΕΣ γλώσσες προγραμματισμού;",
        options: [
          "Αυστηρό και περιορισμένο αλφάβητο",
          "Πλήρης απουσία συντακτικών κανόνων",
          "Εξέλιξη με την πάροδο του χρόνου και παρουσία ασάφειας (πολυσημίας)",
          "Άμεση εκτέλεση από τον επεξεργαστή"
        ],
        correct: 2,
        hint: "Οι φυσικές γλώσσες χρησιμοποιούνται από τους ανθρώπους για επικοινωνία και αλλάζουν φυσικά με τα χρόνια.",
        explanation: "Οι φυσικές γλώσσες εξελίσσονται συνεχώς και παρουσιάζουν πολυσημία/ασάφεια, ενώ οι τεχνητές γλώσσες σχεδιάζονται συνειδητά με αυστηρούς κανόνες."
      },
      {
        id: 9,
        question: "Ποιο κριτήριο αλγορίθμου ικανοποιείται όταν κάθε μεμονωμένη εντολή είναι απλή και εκτελέσιμη σε πεπερασμένο χρόνο;",
        options: [
          "Αποτελεσματικότητα",
          "Καθοριστικότητα",
          "Είσοδος",
          "Περατότητα"
        ],
        correct: 0,
        hint: "Αφορά την πρακτική δυνατότητα εκτέλεσης κάθε εντολής από τον υπολογιστή.",
        explanation: "Η Αποτελεσματικότητα απαιτεί κάθε εντολή να είναι τόσο απλή ώστε να μπορεί να εκτελεστεί θεωρητικά ή πρακτικά σε πεπερασμένο χρόνο."
      },
      {
        id: 10,
        question: "Η «ΓΛΩΣΣΟΜΑΘΕΙΑ» είναι:",
        options: [
          "Γλώσσα προγραμματισμού χαμηλού επιπέδου",
          "Εκπαιδευτικό προγραμματιστικό περιβάλλον για τη «ΓΛΩΣΣΑ» της Γ΄ Λυκείου",
          "Λειτουργικό σύστημα",
          "Βάση δεδομένων"
        ],
        correct: 1,
        hint: "Είναι το λογισμικό που χρησιμοποιείται στο μάθημα για τη συγγραφή και εκτέλεση προγραμμάτων.",
        explanation: "Η Γλωσσομάθεια είναι το αυτόνομο εκπαιδευτικό περιβάλλον ανάπτυξης αλγορίθμων και προγραμμάτων στη διδασκόμενη «ΓΛΩΣΣΑ»."
      }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questionsData.length).fill(null);
    let hintShown = new Array(questionsData.length).fill(false);

    function loadQuestion() {
      const q = questionsData[currentIndex];
      
      // Update progress
      const total = questionsData.length;
      document.getElementById('question-counter').innerText = `Ερώτηση ${currentIndex + 1} από ${total}`;
      const percent = Math.round(((currentIndex + 1) / total) * 100);
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-bar-fill').style.width = `${percent}%`;

      // Question Text
      document.getElementById('question-text').innerText = `${q.id}. ${q.question}`;

      // Options
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const answered = userAnswers[currentIndex] !== null;

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${optText}</span>`;

        if (answered) {
          btn.disabled = true;
          if (idx === q.correct) {
            btn.classList.add('selected-correct');
            btn.innerHTML += ` <span>✓</span>`;
          } else if (idx === userAnswers[currentIndex]) {
            btn.classList.add('selected-incorrect');
            btn.innerHTML += ` <span>✗</span>`;
          }
        } else {
          btn.onclick = () => selectAnswer(idx);
        }

        container.appendChild(btn);
      });

      // Hint Box State
      const hintBox = document.getElementById('hint-box');
      if (hintShown[currentIndex]) {
        document.getElementById('hint-text').innerText = q.hint;
        hintBox.style.display = 'block';
      } else {
        hintBox.style.display = 'none';
      }

      // Explanation Box State
      const expBox = document.getElementById('explanation-box');
      if (answered) {
        document.getElementById('explanation-text').innerText = q.explanation;
        expBox.style.display = 'block';
      } else {
        expBox.style.display = 'none';
      }

      // Next Button State
      document.getElementById('next-btn').disabled = !answered;
      if (currentIndex === total - 1) {
        document.getElementById('next-btn').innerText = 'Ολοκλήρωση & Αποστολή 🏁';
      } else {
        document.getElementById('next-btn').innerText = 'Επόμενη ➔';
      }
    }

    function selectAnswer(optIdx) {
      userAnswers[currentIndex] = optIdx;
      loadQuestion();
    }

    function toggleHint() {
      hintShown[currentIndex] = !hintShown[currentIndex];
      const hintBox = document.getElementById('hint-box');
      if (hintShown[currentIndex]) {
        document.getElementById('hint-text').innerText = questionsData[currentIndex].hint;
        hintBox.style.display = 'block';
      } else {
        hintBox.style.display = 'none';
      }
    }

    function nextQuestion() {
      if (currentIndex < questionsData.length - 1) {
        currentIndex++;
        loadQuestion();
      } else {
        showReport();
      }
    }

    function showReport() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('report-view').style.display = 'block';

      let correctCount = 0;
      questionsData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) correctCount++;
      });

      const total = questionsData.length;
      const scorePct = Math.round((correctCount / total) * 100);

      document.getElementById('final-score').innerText = `${correctCount} / ${total}`;

      const badge = document.getElementById('score-badge');
      const msg = document.getElementById('score-message');

      if (scorePct >= 90) {
        badge.innerText = '🏆 ΑΡΙΣΤΑ (' + scorePct + '%)';
        badge.style.backgroundColor = '#E8F5E9';
        badge.style.color = '#3B7A57';
        msg.innerText = 'Εξαιρετική επίδοση! Έχετε κατανοήσει πλήρως τις βασικές έννοιες της 1ης εβδομάδας.';
      } else if (scorePct >= 70) {
        badge.innerText = '👍 ΠΟΛΥ ΚΑΛΑ (' + scorePct + '%)';
        badge.style.backgroundColor = '#FFF9F2';
        badge.style.color = '#D97724';
        msg.innerText = 'Πολύ καλό αποτέλεσμα! Ρίξτε μια ματιά στις αιτιολογήσεις των ερωτήσεων που χάσατε.';
      } else {
        badge.innerText = '⚠️ ΧΡΕΙΑΖΕΤΑΙ ΕΠΑΝΑΛΗΨΗ (' + scorePct + '%)';
        badge.style.backgroundColor = '#FDF2F0';
        badge.style.color = '#B84A39';
        msg.innerText = 'Συνιστάται προσεκτική μελέτη του οδηγού επανάληψης SOS και ξανά εκτέλεση του quiz.';
      }

      // Render Detailed Summary
      const listContainer = document.getElementById('report-list');
      listContainer.innerHTML = '';

      questionsData.forEach((q, idx) => {
        const uAns = userAnswers[idx];
        const isCorrect = uAns === q.correct;

        const item = document.createElement('div');
        item.className = `report-item ${isCorrect ? 'correct' : 'incorrect'}`;

        const uText = uAns !== null ? `${String.fromCharCode(65 + uAns)}. ${q.options[uAns]}` : 'Δεν απαντήθηκε';
        const cText = `${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}`;

        item.innerHTML = `
          <div class="report-q-title">${q.id}. ${q.question}</div>
          <div class="report-ans user-choice"><strong>Η απάντησή σας:</strong> ${uText} ${isCorrect ? '✓' : '✗'}</div>
          ${!isCorrect ? `<div class="report-ans correct-choice"><strong>Σωστή απάντηση:</strong> ${cText}</div>` : ''}
          <div class="report-exp">📌 <strong>Αιτιολόγηση:</strong> ${q.explanation}</div>
        `;

        listContainer.appendChild(item);
      });
    }

    function resetQuiz() {
      currentIndex = 0;
      userAnswers = new Array(questionsData.length).fill(null);
      hintShown = new Array(questionsData.length).fill(false);
      document.getElementById('report-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      loadQuestion();
    }

    // INITIAL LOAD
    loadQuestion();
  </script>
</body>
</html>
